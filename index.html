<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    
    <header>
        <a href="" class="logo">Ecommerce</a>
        <div id="cart-icon">
            <i class="ri-shopping-bag-line"></i>
            <span class="cart-item-count"></span>
        </div>
    </header>

    <!-- Cart section start -->


    <div class="cart">
        <h2 class="cart-title">Your cart</h2>
        <div class="cart-content">
            <!-- <div class="cart-box">
                <img src="imag/cart/img2.jpg" class="cart-img">
                <div class="cart-detail">
                    <h2 class="cart-product-title">over size t-shirt</h2>
                    <span class="cart-price">$1000.0</span>
                    <div class="cart-quantity">
                        <button id="decrement">-</button>
                        <span class="number">1</span>
                        <button id="increment">+</button>
                    </div>
                </div>
                <i class="ri-delete-bin-6-line cart-remove"></i>
            </div> -->
        </div>
        <div class="total">
            <div class="total-title">Totle</div>
            <div class="total-price">$0</div>
        </div>
        <button class="btn-buy">Buy now </button>
        <i class="ri-close-line" id="cart-close"></i>
    </div>

    <!-- Cart section end -->

    <section class="shop">
       <h1 class="section-title">shop products</h1>
       <div class="product-content">
            <div class="product-box">
                <div class="img-box">
                    <img src="imag/img1.jpg" alt="">
                </div>
                <h2 class="product-title">White t-shirt</h2>
                <div class="price-and-cart">
                    <span class="price">$150</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="product-box">
                <div class="img-box">
                    <img src="imag/img2.jpg" alt="">
                </div>
                <h2 class="product-title">Sandstone t-shirt</h2>
                <div class="price-and-cart">
                    <span class="price">$100</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="product-box">
                <div class="img-box">
                    <img src="imag/img3.jpg" alt="">
                </div>
                <h2 class="product-title">BALENCIAGA BB</h2>
                <div class="price-and-cart">
                    <span class="price">$1,450</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="product-box">
                <div class="img-box">
                    <img src="imag/img4.jpg" alt="">
                </div>
                <h2 class="product-title">Pavilion T-Shirt </h2>
                <div class="price-and-cart">
                    <span class="price">$26.00</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>
            
            <div class="product-box">
                <div class="img-box">
                    <img src="imag/img5.jpg" alt="">
                </div>
                <h2 class="product-title">three-piece suit</h2>
                <div class="price-and-cart">
                    <span class="price">$500</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>
            
            <div class="product-box">
                <div class="img-box">
                    <img src="imag/img6.jpg" alt="">
                </div>
                <h2 class="product-title">Trenz Shirt Company</h2>
                <div class="price-and-cart">
                    <span class="price">$1,500.00</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>
            
            <div class="product-box">
                <div class="img-box">
                    <img src="imag/img7.jpg" alt="">
                </div>
                <h2 class="product-title">Calvin Klein t-shirt </h2>
                <div class="price-and-cart">
                    <span class="price">$28.75</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="product-box">
                <div class="img-box">
                    <img src="imag/img8.jpg" alt="">
                </div>
                <h2 class="product-title">"BROOKLYN NY" sweatshirt </h2>
                <div class="price-and-cart">
                    <span class="price">$7.17</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>
        </div> 
    </section>





    <script src="script.js"></script>
